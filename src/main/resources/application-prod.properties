# ---- Profilo "prod": PostgreSQL (es. su Render) ----
# Host/porta/nome DB arrivano come variabili d'ambiente dal database gestito.
# Username e password sono letti da SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Render (e simili) stanno dietro un proxy HTTPS: rispetta gli header X-Forwarded-*
# cosi' redirect e cookie usano lo schema/host corretti (https).
server.forward-headers-strategy=framework

# Console H2 disattivata in produzione
spring.h2.console.enabled=false
