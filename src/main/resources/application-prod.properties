# ---- Profilo "prod": PostgreSQL su Supabase ----
# La connessione arriva dalle variabili d'ambiente (impostate su Render/host):
#   SPRING_DATASOURCE_URL       es. jdbc:postgresql://<host>:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME  es. postgres  (o l'utente del pooler)
#   SPRING_DATASOURCE_PASSWORD  la password del progetto Supabase
# Nota Supabase: usare la connessione DIRETTA (porta 5432) o il "session pooler",
# NON il "transaction pooler" (6543) che non e' compatibile con i prepared statements
# di Hibernate. In ogni caso aggiungere sslmode=require all'URL.
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Pool di connessioni (HikariCP) ----
# Il pooler di Supabase in "session mode" limita i CLIENT totali a pool_size (15).
# In session mode ogni connessione tenuta da Hikari occupa un client per tutta la
# sua durata; durante un redeploy le connessioni della vecchia istanza restano
# agganciate finche' non scadono, mentre la nuova ne apre di sue. Con il default
# di Hikari (10 per istanza) la sovrapposizione supera il tetto di 15 e Supabase
# risponde: "max clients reached in session mode (EMAXCONNSESSION)".
# Teniamo quindi il pool piccolo (5): anche con l'overlap di un redeploy si resta
# ampiamente sotto 15. Per un time-tracker a bassa concorrenza e' piu' che sufficiente.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=60000

# Lo schema e' gestito su Supabase (non da Hibernate): validiamo soltanto la corrispondenza.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Dialect esplicito: evita il messaggio fuorviante "Unable to determine Dialect"
# quando la connessione al DB non riesce all'avvio (fa emergere l'errore reale).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render (e simili) stanno dietro un proxy HTTPS: rispetta gli header X-Forwarded-*
# cosi' redirect e cookie usano lo schema/host corretti (https).
server.forward-headers-strategy=framework

# Console H2 disattivata in produzione
spring.h2.console.enabled=false
