spring.application.name=consuntiver

# La piattaforma di hosting (es. Render) inietta la porta via variabile PORT.
server.port=${PORT:8080}

# Quota gli identificatori: evita conflitti con parole riservate (value, year, users)
# e mantiene i nomi (minuscoli) coerenti tra H2 e PostgreSQL/Supabase.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Versioning dei file statici (hash nel nome): a ogni modifica di css/js l'URL
# cambia, cosi' il browser non serve versioni vecchie dalla cache.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**

# ---- Profilo di default: sviluppo locale con H2 ----
# H2 su file: i dati restano tra i riavvii (cartella ./data nella root del progetto)
spring.datasource.url=jdbc:h2:file:./data/consuntiver;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console H2 raggiungibile su http://localhost:8080/h2-console (utile in sviluppo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
