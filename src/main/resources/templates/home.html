<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Shield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Colori per task: una classe .tc-<idtask> per ciascun task, generata a runtime. -->
    <style th:utext="${taskColorCss}"></style>
</head>
<body class="term">
<div class="screen">

    <header th:replace="~{fragments/header :: header}"></header>

    <div class="layout">
        <div class="main-col">

            <!-- ---------- TIMER ---------- -->
            <section class="panel panel--green worktime"
                     id="worktime"
                     th:attr="data-entry=${workDay.entryMillis},
                              data-lunch-start=${workDay.lunchStartMillis},
                              data-lunch-end=${workDay.lunchEndMillis},
                              data-exit=${workDay.exitMillis},
                              data-server-now=${serverNowMillis},
                              data-target=${targetSeconds},
                              data-default-break=${defaultBreakSeconds},
                              data-min-break=${minBreakSeconds}">
                <span class="panel-label">Timer</span>
                <div class="worktime-top">
                    <div class="worktime-counter">
                        <span id="wt-counter" class="wt-counter">00:00:00</span>
                        <span class="wt-target">/ 08:00:00</span>
                    </div>
                </div>

                <div class="wt-progress"><div id="wt-bar" class="wt-progress-fill"></div></div>
                <div id="wt-status" class="wt-status">&nbsp;</div>

                <!-- Quattro orari inseriti a mano: entrata, pausa, rientro, uscita -->
                <form class="worktime-form" th:action="@{/worktimes}" method="post">
                    <div class="wt-field">
                        <label for="wt-entry">Entrata</label>
                        <input type="time" id="wt-entry" name="entry" th:value="${workDay.entry}">
                    </div>
                    <div class="wt-field">
                        <label for="wt-lunch-start">Pausa pranzo</label>
                        <input type="time" id="wt-lunch-start" name="lunchStart" th:value="${workDay.lunchStart}">
                    </div>
                    <div class="wt-field">
                        <label for="wt-lunch-end">Rientro</label>
                        <input type="time" id="wt-lunch-end" name="lunchEnd" th:value="${workDay.lunchEnd}">
                    </div>
                    <div class="wt-field">
                        <label for="wt-exit">Uscita</label>
                        <input type="time" id="wt-exit" name="exit" th:value="${workDay.exit}">
                    </div>
                    <button type="submit" class="btn-in">Salva orari</button>
                </form>
            </section>

            <!-- ---------- OGGI (log + input) ---------- -->
            <section class="panel history">
                <span class="panel-label" th:text="'Oggi / ' + ${todayLabel}">Oggi</span>

                <p th:if="${entries.isEmpty()}" class="empty">
                    Nessuna voce per oggi. Scrivi cosa stai facendo qui sotto.
                </p>

                <ul class="entry-list">
                    <li class="entry" th:each="entry : ${entries}"
                        th:classappend="${entryTaskClass.containsKey(entry.id) ? entryTaskClass.get(entry.id) : ''}">
                        <div class="entry-view">
                            <button type="button" class="entry-time time-edit-toggle"
                                    title="Modifica orari" aria-label="Modifica orari">
                                <span class="entry-start" th:text="${dateTimeFormat.format(entry.startedAt)}">01/07 09:30</span>
                                <span class="entry-end"
                                      th:text="${entry.endedAt != null ? '→ ' + timeFormat.format(entry.endedAt) : '→ …'}">→ 10:00</span>
                            </button>
                            <span class="entry-sym" title="Colore del task">●</span>
                            <span class="entry-text" th:text="${entry.description}">Descrizione</span>
                            <!-- Termina attività: a sinistra del tempo totale, solo sulla riga aperta -->
                            <form th:if="${entry.endedAt == null}" class="end-form"
                                  th:action="@{'/entries/' + ${entry.id} + '/end'}" method="post">
                                <button type="submit" class="icon-btn icon-end"
                                        title="Termina attività" aria-label="Termina attività">
                                    <span class="medallion" aria-hidden="true"></span>
                                </button>
                            </form>
                            <span class="ctx-time" th:if="${contextTimes.containsKey(entry.id)}">
                                <span class="ctx-time-btn"
                                      th:title="'Tempo totale su questo argomento (ore)'"
                                      th:text="${contextTimes.get(entry.id).label}">+0,75</span>
                                <span class="ctx-time-actual"
                                      th:title="'Tempo effettivo'"
                                      th:text="'(' + ${contextTimes.get(entry.id).actual} + ')'">(0:47)</span>
                            </span>
                            <span class="entry-actions">
                                <button type="button" class="icon-btn edit-toggle" title="Modifica" aria-label="Modifica">
                                    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                                         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                        <path d="M12 20h9"/>
                                        <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
                                    </svg>
                                </button>
                                <form class="delete-form" th:action="@{'/entries/' + ${entry.id} + '/delete'}" method="post"
                                      onsubmit="return confirm('Eliminare questa riga?');">
                                    <button type="submit" class="icon-btn icon-delete" title="Elimina" aria-label="Elimina">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                                             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                            <path d="M18 6 6 18M6 6l12 12"/>
                                        </svg>
                                    </button>
                                </form>
                            </span>
                        </div>
                        <form class="entry-edit" th:action="@{'/entries/' + ${entry.id}}" method="post" hidden>
                            <input type="text" name="description" th:value="${entry.description}"
                                   autocomplete="off" required>
                            <button type="submit">Salva</button>
                            <button type="button" class="edit-cancel link-button">Annulla</button>
                        </form>
                        <!-- Modifica orari (nascosta finche' non si clicca sul badge orari) -->
                        <form class="time-edit" th:action="@{'/entries/' + ${entry.id} + '/times'}" method="post" hidden>
                            <label>Inizio
                                <input type="time" name="start"
                                       th:value="${timeFormat.format(entry.startedAt)}" required>
                            </label>
                            <label>Fine
                                <input type="time" name="end"
                                       th:value="${entry.endedAt != null ? timeFormat.format(entry.endedAt) : ''}">
                            </label>
                            <button type="submit">Salva</button>
                            <button type="button" class="time-edit-cancel link-button">Annulla</button>
                        </form>
                    </li>
                </ul>

                <!-- riga di inserimento -->
                <form class="prompt-bar" th:action="@{/entries}" method="post">
                    <span class="prompt-caret">&gt;</span>
                    <select class="task-picker" th:if="${!myTasks.isEmpty()}" title="Inserisci un task nel testo">
                        <option value="">+ task</option>
                        <option th:each="o : ${myTasks}"
                                th:value="'#' + ${o.code}"
                                th:text="'#' + ${o.code} + ' — ' + ${o.name}">#12345 — Nome</option>
                    </select>
                    <input type="text"
                           name="description"
                           placeholder="Su cosa stai lavorando ora?"
                           autocomplete="off"
                           autofocus
                           required>
                    <button type="submit">Registra</button>
                </form>
            </section>
        </div><!-- /.main-col -->

        <!-- ---------- colonna destra: TASK + TOTALE ---------- -->
        <aside class="task-sidebar">
            <section class="panel">
                <span class="panel-label">Task</span>
                <p th:if="${taskLinks.isEmpty()}" class="empty">
                    Nessun task rilevato. Cita un numero (es. #12345) in una riga.
                </p>
                <ul class="task-list">
                    <li class="task" th:each="t : ${taskLinks}" th:classappend="'tc-' + ${t.id}">
                        <span class="task-head">
                            <span class="entry-sym">●</span>
                            <a class="task-id" th:href="${t.url}" target="_blank" rel="noopener"
                               th:attr="data-clipboard=${taskClipboard.get(t.id)}"
                               title="Copia il rapportino negli appunti e apri il task"
                               th:text="'#' + ${t.id}">#12345</a>
                            <span class="task-time" th:if="${taskTimes.containsKey(t.id)}"
                                  th:text="${taskTimes.get(t.id).label} + ' (' + ${taskTimes.get(t.id).actual} + ')'">+1 (1:00)</span>
                        </span>
                        <span class="task-desc" th:text="${t.description}">descrizione della riga</span>
                    </li>
                </ul>
            </section>

            <section class="panel panel--yellow task-total" th:if="${contextTotal.hasTotal}">
                <span class="panel-label">Totale tempo</span>
                <span class="task-total-value">
                    <span class="task-total-quarters" th:text="${contextTotal.totalLabel} + ' h'">2,75 h</span>
                    <span class="task-total-actual" th:text="'(' + ${contextTotal.totalActual} + ')'">(2:32)</span>
                </span>
            </section>
        </aside>

    </div><!-- /.layout -->
</div><!-- /.screen -->

<script th:src="@{/js/app.js}"></script>
</body>
</html>
