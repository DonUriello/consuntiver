<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consuntiver</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="app-page">
<header class="app-header">
    <div class="app-title">Consuntiver</div>
    <div class="app-nav">
        <a class="ext-link" th:href="@{/fixed-tasks}">Task fissi</a>
        <a class="ext-link" href="https://prd.galileonetwork.it/easy/" target="_blank" rel="noopener">Easy ↗</a>
        <span class="app-user" th:text="${username}">utente</span>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="link-button">Esci</button>
        </form>
    </div>
</header>

<div class="layout">
<div class="main-col">

<!-- ---------- Orario di lavoro ---------- -->
<section class="worktime"
         id="worktime"
         th:attr="data-accumulated=${summary.accumulatedSeconds},
                  data-open-since=${summary.openSinceMillis},
                  data-server-now=${serverNowMillis},
                  data-target=${targetSeconds}">
    <div class="worktime-top">
        <div class="worktime-counter">
            <span id="wt-counter" class="wt-counter">00:00:00</span>
            <span class="wt-target">/ 08:00:00</span>
        </div>
        <div class="worktime-actions">
            <form th:action="@{/attendance/in}" method="post">
                <button type="submit" class="btn-in"
                        th:disabled="${summary.clockedIn()}">Inizio</button>
            </form>
            <form th:action="@{/attendance/out}" method="post">
                <button type="submit" class="btn-out"
                        th:disabled="${!summary.clockedIn()}">Pausa</button>
            </form>
            <form th:action="@{/attendance/end}" method="post">
                <button type="submit" class="btn-end"
                        th:disabled="${!summary.clockedIn()}">Fine</button>
            </form>
        </div>
    </div>

    <div class="wt-progress"><div id="wt-bar" class="wt-progress-fill"></div></div>
    <div id="wt-status" class="wt-status">&nbsp;</div>

    <ul class="punch-list" th:if="${!attendances.isEmpty()}">
        <li th:each="a : ${attendances}">
            <span class="punch-in" th:text="${timeFormat.format(a.clockIn)}">09:00</span>
            <span class="punch-sep">→</span>
            <span class="punch-out"
                  th:text="${a.clockOut != null ? timeFormat.format(a.clockOut) : 'in corso…'}">18:00</span>
        </li>
    </ul>
</section>

<!-- ---------- Storico di oggi ---------- -->
<main class="history">
    <h2>Oggi</h2>

    <p th:if="${entries.isEmpty()}" class="empty">
        Nessuna voce per oggi. Scrivi cosa stai facendo qui sotto.
    </p>

    <ul class="entry-list">
        <li class="entry" th:each="entry : ${entries}">
            <div class="entry-view">
                <span class="entry-time" th:text="${timeFormat.format(entry.createdAt)}">09:30</span>
                <span class="entry-text" th:text="${entry.description}">Descrizione</span>
                <button type="button" class="edit-toggle link-button">Modifica</button>
            </div>
            <form class="entry-edit" th:action="@{'/entries/' + ${entry.id}}" method="post" hidden>
                <input type="text" name="description" th:value="${entry.description}"
                       autocomplete="off" required>
                <button type="submit">Salva</button>
                <button type="button" class="edit-cancel link-button">Annulla</button>
            </form>
        </li>
    </ul>
</main>

<!-- ---------- Barra di inserimento ---------- -->
<form class="prompt-bar" th:action="@{/entries}" method="post">
    <input type="text"
           name="description"
           placeholder="Su cosa stai lavorando ora?"
           autocomplete="off"
           autofocus
           required>
    <button type="submit">Registra</button>
</form>

</div><!-- /.main-col -->

<!-- ---------- Colonna task ---------- -->
<aside class="task-sidebar">
    <h2>Task</h2>
    <p th:if="${taskLinks.isEmpty()}" class="empty">
        Nessun task rilevato. Cita un numero (es. #12345) in una riga e comparira' qui.
    </p>
    <ul class="task-list">
        <li class="task" th:each="t : ${taskLinks}">
            <a class="task-id" th:href="${t.url}" target="_blank" rel="noopener"
               th:text="'#' + ${t.id}">#12345</a>
            <span class="task-desc" th:text="${t.description}">descrizione della riga</span>
        </li>
    </ul>
</aside>

</div><!-- /.layout -->

<script th:src="@{/js/app.js}"></script>
</body>
</html>
