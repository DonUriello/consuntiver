<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Header unico dell'app: brand + guida + menu di navigazione.
     Incluso in tutte le pagine autenticate (home, storico, task fissi,
     impostazioni) cosi' le voci restano identiche ovunque.
     Le voci sono raggruppate in due menu a tendina (Configurazioni e nome
     utente); su mobile il tutto si apre col pulsante hamburger. -->
<header th:fragment="header" class="app-header">
    <div class="app-brand">
        <a class="app-title" th:href="@{/}">Focus Shield</a>
        <span class="brand-ver">v1.0</span>
        <th:block th:replace="~{fragments/help :: help}"></th:block>
    </div>

    <button type="button" class="nav-toggle" aria-label="Apri il menu"
            aria-controls="app-nav" aria-expanded="false">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
    </button>

    <nav class="app-nav" id="app-nav">
        <a class="ext-link nav-cyan" th:href="@{/}">Home</a>

        <details class="nav-group">
            <summary class="nav-group-label">Configurazioni</summary>
            <div class="nav-drop">
                <a class="ext-link nav-cyan" th:href="@{/fixed-tasks}">Task fissi</a>
                <a class="ext-link nav-cyan" th:href="@{/settings}">Impostazioni</a>
            </div>
        </details>

        <details class="nav-group nav-group--user">
            <summary class="nav-group-label" th:text="${username}">utente</summary>
            <div class="nav-drop">
                <a class="ext-link nav-cyan" th:href="@{/storico}">Storico</a>
                <form th:action="@{/logout}" method="post" class="logout-form">
                    <button type="submit" class="link-button nav-red">Esci</button>
                </form>
            </div>
        </details>
    </nav>

    <!-- Toggle dell'hamburger (mobile) + gestione dei menu a tendina. -->
    <script>
        (function () {
            var header = document.currentScript.parentNode;
            var btn = header.querySelector(".nav-toggle");
            var nav = document.getElementById("app-nav");
            if (btn && nav) {
                btn.addEventListener("click", function () {
                    var open = nav.classList.toggle("open");
                    btn.setAttribute("aria-expanded", open ? "true" : "false");
                });
            }
            var groups = header.querySelectorAll("details.nav-group");
            // Aprendo un menu si chiudono gli altri.
            groups.forEach(function (d) {
                d.addEventListener("toggle", function () {
                    if (d.open) {
                        groups.forEach(function (o) { if (o !== d) { o.open = false; } });
                    }
                });
            });
            // Un click fuori dai menu li chiude.
            document.addEventListener("click", function (e) {
                groups.forEach(function (d) {
                    if (d.open && !d.contains(e.target)) { d.open = false; }
                });
            });
        })();
    </script>
</header>
</body>
</html>
