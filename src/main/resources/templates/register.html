<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrati - Consuntiver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,900;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
<div class="card">
    <h1>Consuntiver</h1>
    <p class="subtitle">Crea il tuo account</p>

    <form th:action="@{/register}" th:object="${form}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required autofocus>
        <span class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required>
        <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>

        <label for="email">Email <span class="opt">(facoltativa)</span></label>
        <input type="email" id="email" th:field="*{email}" autocomplete="email">
        <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <button type="submit">Registrati</button>
    </form>

    <p class="switch">Hai gia' un account? <a th:href="@{/login}">Accedi</a></p>
</div>
</body>
</html>
