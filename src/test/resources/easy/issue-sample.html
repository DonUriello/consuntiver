<!DOCTYPE html>
<!--
  Fixture: pagina di una issue "tipo Redmine" (struttura standard).
  Serve a testare EasyScraperService.parseIssue senza colpire il portale reale.
  Va sostituita/affiancata dall'HTML reale di Easy per calibrare i selettori.
-->
<html lang="it">
<head><title>Focus Shield fixture</title></head>
<body>
<div id="wrapper">
  <div id="content">
    <div class="issue tracker-1 status-2 priority-4 details">
      <div class="subject">
        <div>
          <h3>Aggiunta id_riga e id_lock alla tabella SocietaModuloFunzione</h3>
        </div>
      </div>
      <div class="attributes">
        <div class="status attribute"><div class="label">Stato:</div><div class="value">In corso</div></div>
      </div>
      <div class="description">
        <p><strong>Descrizione</strong></p>
        <div class="wiki">
          <p>Descrizione di esempio del task, con dettagli tecnici sulla modifica.</p>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
