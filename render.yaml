# Blueprint Render: crea il web service (Docker) + un database PostgreSQL gestito.
# Su Render: New > Blueprint > seleziona questo repo. Render legge questo file.
databases:
  - name: consuntiver-db
    plan: free
    databaseName: consuntiver
    user: consuntiver

services:
  - type: web
    name: consuntiver
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: consuntiver-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: consuntiver-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: consuntiver-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: consuntiver-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: consuntiver-db
          property: password
