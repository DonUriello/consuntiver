# Blueprint Render: solo il web service. Il database e' su Supabase.
# Le credenziali del datasource NON stanno qui (sono segreti): vanno impostate
# come variabili d'ambiente del servizio nella dashboard Render:
#   SPRING_DATASOURCE_URL       jdbc:postgresql://<host-supabase>:5432/postgres?sslmode=require
#   SPRING_DATASOURCE_USERNAME  postgres.<project-ref>   (session pooler) oppure postgres (direct)
#   SPRING_DATASOURCE_PASSWORD  <password del database Supabase>
services:
  - type: web
    name: consuntiver
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
